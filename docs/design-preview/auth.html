<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Northline</title>
<link rel="stylesheet" href="index.css" />
</head>
<body>
<div class="app">

<header class="nav">
  <div class="container nav-inner">
    <a href="#" class="logo">Northline</a>
    <form class="nav-search" role="search">
      <input type="search" placeholder="Search products" />
      <button type="submit" class="btn btn-sm">Search</button>
    </form>
    <nav class="nav-links">
      <a href="#">Shop</a>
      <a href="#" class="nav-cart">Cart</a>
      <a href="#" class="active">Sign in</a>
      <a href="#" class="btn btn-sm">Create account</a>
    </nav>
  </div>
</header>

<div class="app-body">
<div class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Two-step verification</h1>
      <p class="muted">Open your authenticator app and enter the six-digit code for Northline.</p>

      <form>
        <div>
          <label for="code">Verification code</label>
          <input id="code" type="text" inputmode="numeric" placeholder="123456"
                 style="letter-spacing:0.45em;text-align:center;font-size:1.35rem;font-weight:640" />
        </div>

        <label class="check"><input type="checkbox" /><span>Trust this device for 30 days</span></label>

        <button class="btn btn-block">Verify and sign in</button>
      </form>

      <div class="social-divider">or</div>

      <div class="social-auth">
        <button class="btn">Use a recovery code</button>
      </div>

      <div class="demo-box">
        Codes rotate every 30 seconds. A code that has already been used will be refused even while it is still
        inside its window.
      </div>
    </div>
  </div>
</div>
</div>
</div>
</body>
</html>
