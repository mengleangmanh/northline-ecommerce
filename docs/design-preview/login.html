<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Northline</title>
<link rel="stylesheet" href="index.css" />
</head>
<body>
<div class="app">

<header class="nav">
  <div class="container nav-inner">
    <a href="#" class="logo">Northline</a>
    <form class="nav-search" role="search">
      <input type="search" placeholder="Search products" />
      <button type="submit" class="btn btn-sm">Search</button>
    </form>
    <nav class="nav-links">
      <a href="#">Shop</a>
      <a href="#" class="nav-cart">Cart</a>
      <a href="#" class="active">Sign in</a>
      <a href="#" class="btn btn-sm">Create account</a>
    </nav>
  </div>
</header>

<div class="app-body">
<div class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to see your cart and order history.</p>

      <div class="social-auth">
        <button class="btn btn-social btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z" />
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z" />
            <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33Z" />
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z" />
          </svg>
          <span>Continue with Google</span>
        </button>
        <button class="btn btn-social btn-facebook">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#1877F2" d="M18 9a9 9 0 1 0-10.41 8.89v-6.29H5.31V9h2.28V7.02c0-2.25 1.34-3.5 3.4-3.5.98 0 2.01.18 2.01.18v2.21h-1.13c-1.12 0-1.47.69-1.47 1.4V9h2.5l-.4 2.6h-2.1v6.29A9 9 0 0 0 18 9Z" />
          </svg>
          <span>Continue with Facebook</span>
        </button>
      </div>

      <div class="social-divider">or use your email</div>

      <form>
        <label>
          Email
          <input type="email" placeholder="you@example.com" />
        </label>

        <label>
          Password
          <input type="password" placeholder="Your password" />
        </label>

        <button type="submit" class="btn btn-block">Sign in</button>
      </form>

      <p class="muted center" style="margin-top:18px">
        No account yet? <a href="#" class="link">Create one</a>
      </p>
    </div>
  </div>
</div>
</div>

</div>
</body>
</html>
